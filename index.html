<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Iron Nest</title>
  <meta name="theme-color" content="#E62425">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Tag Ikon Khusus untuk iOS dan Android -->
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/pw/AP1GczPPcudI_VYBZPj5zVcOGfvNoAtQQJyvCvTp0r4940mImekbApI95J7ps63c6TWlwP3WRCaicJFmqimCEz9jvRYQBMKlX34t6kpB1CWHD_55ZYS1PFd0SMFMe6ZVfHplBrsxbiBrQU0K62W3TG_97lWA=w400-h400-s-no-gm?authuser=0">
  <link rel="icon" type="image/jpeg" href="https://lh3.googleusercontent.com/pw/AP1GczPPcudI_VYBZPj5zVcOGfvNoAtQQJyvCvTp0r4940mImekbApI95J7ps63c6TWlwP3WRCaicJFmqimCEz9jvRYQBMKlX34t6kpB1CWHD_55ZYS1PFd0SMFMe6ZVfHplBrsxbiBrQU0K62W3TG_97lWA=w400-h400-s-no-gm?authuser=0">

  <!-- Manifest PWA Standalone -->
  <script>
    const manifestPWA = {
      "name": "Iron Nest",
      "short_name": "Iron Nest",
      "description": "Ballistic Calculator",
      "start_url": ".",
      "display": "standalone",
      "background_color": "#E62425",
      "theme_color": "#E62425",
      "orientation": "portrait",
      "icons": [
        {
          "src": "https://lh3.googleusercontent.com/pw/AP1GczPPcudI_VYBZPj5zVcOGfvNoAtQQJyvCvTp0r4940mImekbApI95J7ps63c6TWlwP3WRCaicJFmqimCEz9jvRYQBMKlX34t6kpB1CWHD_55ZYS1PFd0SMFMe6ZVfHplBrsxbiBrQU0K62W3TG_97lWA=w400-h400-s-no-gm?authuser=0",
          "sizes": "192x192",
          "type": "image/jpeg",
          "purpose": "any maskable"
        },
        {
          "src": "https://lh3.googleusercontent.com/pw/AP1GczPPcudI_VYBZPj5zVcOGfvNoAtQQJyvCvTp0r4940mImekbApI95J7ps63c6TWlwP3WRCaicJFmqimCEz9jvRYQBMKlX34t6kpB1CWHD_55ZYS1PFd0SMFMe6ZVfHplBrsxbiBrQU0K62W3TG_97lWA=w400-h400-s-no-gm?authuser=0",
          "sizes": "512x512",
          "type": "image/jpeg",
          "purpose": "any maskable"
        }
      ]
    };
    const blob = new Blob([JSON.stringify(manifestPWA)], {type: 'application/json'});
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  </script>

  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #E62425; 
      font-family: sans-serif;
    }

    /* TRIK SKALA IFRAME 50% */
    #app-frame { 
      width: 200%; 
      height: 200%; 
      border: none; 
      display: block; 
      transform: scale(0.8); 
      transform-origin: 0 0; 
    }
    
    /* LAYAR SPLASH SCREEN GAMBAR PENUH */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://lh3.googleusercontent.com/pw/AP1GczPPcudI_VYBZPj5zVcOGfvNoAtQQJyvCvTp0r4940mImekbApI95J7ps63c6TWlwP3WRCaicJFmqimCEz9jvRYQBMKlX34t6kpB1CWHD_55ZYS1PFd0SMFMe6ZVfHplBrsxbiBrQU0K62W3TG_97lWA=w400-h400-s-no-gm?authuser=0');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 9999;
      transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.6s;
    }
  </style>
</head>
<body>

  <!-- Layar loading -->
  <div id="loading-screen"></div>

  <!-- Iframe Aplikasi Google Apps Script -->
  <iframe id="app-frame" src="https://script.google.com/macros/s/AKfycbzmd8Tb3Ze17ibcnFw0OZCSRCU9m_xojObHRX0P_51hRXOfM0qZjnpak3SmCGj1xzXR/exec"></iframe>

  <script>
    const iframe = document.getElementById('app-frame');
    const loadingScreen = document.getElementById('loading-screen');

    iframe.addEventListener('load', function() {
      setTimeout(() => {
        loadingScreen.style.opacity = '0';
        setTimeout(() => {
          loadingScreen.style.visibility = 'hidden';
        }, 600); 
      }, 500);
    });

    // Registrasi Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        const swCode = `
          self.addEventListener('install', e => self.skipWaiting());
          self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
        `;
        const blobSW = new Blob([swCode], {type: 'application/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(blobSW));
      });
    }
  </script>
</body>
</html>
