<html lang="id">
<head>

  <title>Iron Nest</title>
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Tag Ikon Khusus untuk iOS dan Android -->
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/pw/AP1GczNprJnAx4m8iFrS8mLOzZsnO3XdBu5KoasgJEipKXwmdEKX58T5dYqATdiYmIf24WKP_fZnsm3hP-hIoJwjgPuHhtOGXYk_MS2ZJFtYZF2h1eW1FBijVEvIloFOWa_KuprEIEOWlN1ZCeIZMasmtQZx=w945-h945-s-no-gm?authuser=0">
  <link rel="icon" type="image/jpeg" href="https://lh3.googleusercontent.com/pw/AP1GczNprJnAx4m8iFrS8mLOzZsnO3XdBu5KoasgJEipKXwmdEKX58T5dYqATdiYmIf24WKP_fZnsm3hP-hIoJwjgPuHhtOGXYk_MS2ZJFtYZF2h1eW1FBijVEvIloFOWa_KuprEIEOWlN1ZCeIZMasmtQZx=w945-h945-s-no-gm?authuser=0">

  <!-- Manifest PWA Standalone -->
  <script>
    const manifestPWA = {
      "name": "Iron Nest",
      "short_name": "Iron Nest",
      "description": "Ballistic Calculator",
      "start_url": ".",
      "display": "standalone",
      "background_color": "#0a0a0a",
      "theme_color": "#0a0a0a",
      "orientation": "portrait",
      "icons": [
        {
          "src": "https://lh3.googleusercontent.com/pw/AP1GczNprJnAx4m8iFrS8mLOzZsnO3XdBu5KoasgJEipKXwmdEKX58T5dYqATdiYmIf24WKP_fZnsm3hP-hIoJwjgPuHhtOGXYk_MS2ZJFtYZF2h1eW1FBijVEvIloFOWa_KuprEIEOWlN1ZCeIZMasmtQZx=w945-h945-s-no-gm?authuser=0",
          "sizes": "192x192",
          "type": "image/jpeg",
          "purpose": "any maskable"
        },
        {
          "src": "https://lh3.googleusercontent.com/pw/AP1GczNprJnAx4m8iFrS8mLOzZsnO3XdBu5KoasgJEipKXwmdEKX58T5dYqATdiYmIf24WKP_fZnsm3hP-hIoJwjgPuHhtOGXYk_MS2ZJFtYZF2h1eW1FBijVEvIloFOWa_KuprEIEOWlN1ZCeIZMasmtQZx=w945-h945-s-no-gm?authuser=0",
          "sizes": "512x512",
          "type": "image/jpeg",
          "purpose": "any maskable"
        }
      ]
    };
    const blob = new Blob([JSON.stringify(manifestPWA)], {type: 'application/json'});
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  </script>

  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #0a0a0a; 
      font-family: sans-serif;
    }

    /* TRIK SKALA IFRAME 75% */
    #app-frame { 
      width: 133.333%; 
      height: 133.333%; 
      border: none; 
      display: block; 
      transform: scale(0.75); 
      transform-origin: 0 0; 
    }
  </style>
</head>
<body>

  <!-- Iframe Aplikasi Google Apps Script -->
  <iframe id="app-frame" src="https://script.google.com/macros/s/AKfycbzmd8Tb3Ze17ibcnFw0OZCSRCU9m_xojObHRX0P_51hRXOfM0qZjnpak3SmCGj1xzXR/exec"></iframe>

  <script>
    // Registrasi Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        const swCode = `
          self.addEventListener('install', e => self.skipWaiting());
          self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
        `;
        const blobSW = new Blob([swCode], {type: 'application/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(blobSW));
      });
    }
  </script>
</body>
</html>
